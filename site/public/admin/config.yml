# Decap CMS configuration.
#
# Backend: GitHub, via the small OAuth proxy Worker in /workers/decap-oauth
# (Cloudflare Pages doesn't support Netlify's git-gateway backend). See
# docs/README.md → "Editing content (Decap CMS)" for the one-time setup.
#
# publish_mode: editorial_workflow gives every content edit a Draft → In
# Review → Ready lifecycle before it goes live — this IS the approval
# workflow the brief asks for (§6), built in rather than custom-coded.
backend:
  name: github
  repo: your-github-org/your-repo-name
  branch: main
  base_url: https://decap-oauth.YOUR-SUBDOMAIN.workers.dev
  auth_endpoint: auth

publish_mode: editorial_workflow
media_folder: "site/public/uploads"
public_folder: "/uploads"
site_url: "https://example.org"

collections:
  - name: sermons
    label: Sermons
    label_singular: Sermon
    folder: "site/src/content/sermons"
    create: true
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    summary: "{{date}} — {{service}}{{#if title}} · {{title}}{{/if}}"
    sortable_fields: ["date", "service"]
    fields:
      - { label: Date, name: date, widget: datetime, format: "YYYY-MM-DD", hint: "The date of the SERVICE, not the day it was uploaded" }
      - { label: Service, name: service, widget: string, default: "Sunday Morning Worship", hint: "e.g. Sunday Morning Worship, Wednesday Prayer and Praise" }
      - label: "Service type"
        name: serviceType
        widget: select
        default: sunday-morning
        options: [sunday-morning, sunday-evening, wednesday, other]
        hint: "Used for the filter buttons on the Sermons page"
      - { label: "YouTube video ID", name: youtubeId, hint: "Just the 11-character ID from the video URL, not the full link", widget: string }
      - { label: "Sermon title", name: title, widget: string, required: false, hint: "Optional. Imported services have none — add one and it replaces the service label as the heading." }
      - { label: Speaker, name: speaker, widget: string, required: false }
      - { label: Series, name: series, widget: string, required: false }
      - { label: "Scripture reference", name: scripture, widget: string, required: false }
      - { label: "Notes / description", name: body, widget: markdown, required: false }
      - { label: "Draft (hide from site)", name: draft, widget: boolean, default: false }

  - name: beliefs
    label: "What We Believe"
    label_singular: "Article of faith"
    folder: "site/src/content/beliefs"
    create: true
    slug: "{{order}}-{{slug}}"
    summary: "{{order}}. {{title}}"
    sortable_fields: ["order", "title"]
    fields:
      - { label: Title, name: title, widget: string, hint: "e.g. About God" }
      - { label: "Sort order", name: order, widget: number, hint: "Controls the numbering and the order on the page" }
      - { label: Statement, name: body, widget: markdown }

  - name: staff
    label: "Staff & Leadership"
    label_singular: "Person"
    folder: "site/src/content/staff"
    create: true
    slug: "{{slug}}"
    summary: "{{name}} — {{role}}"
    sortable_fields: ["order", "name"]
    fields:
      - { label: Name, name: name, widget: string }
      - { label: Role, name: role, widget: string, hint: "e.g. Pastor, Children's Director" }
      - { label: "Sort order", name: order, widget: number }
      - label: Photo
        name: photo
        widget: select
        required: false
        options: ["pastor"]   # keys from site/src/lib/staff-assets.ts
        hint: "Leave blank to show a 'Photo needed' marker. New photos must be added to src/lib/staff-assets.ts first."
      - { label: "Photo focal point (%)", name: focus, widget: number, required: false, default: 22, value_type: int, min: 0, max: 100, hint: "How far down the photo the circle centres. 22 suits most portraits; lower moves the crop up." }
      - { label: "Photo description (alt text)", name: photoAlt, widget: string, required: false, hint: "Only needed if the photo shows more than the one person — otherwise it's built from the name and role" }
      - { label: Bio, name: body, widget: markdown, required: false }

  - name: ministries
    label: Ministries
    folder: "site/src/content/ministries"
    create: false # Ministries are fixed slots per the brief; edit existing entries rather than adding new ones. (Currently 4 — the men's ministry was pulled 2026-08-29 pending a new name; ask Claude to re-add it once the pastor has one.)
    slug: "{{slug}}"
    fields:
      - { label: Name, name: name, widget: string }
      - { label: "Sort order", name: order, widget: number }
      - { label: "Age range", name: ageRange, widget: string, required: false }
      - label: "Accent (ministry brand ramp)"
        name: accent
        widget: select
        options: [kids, youth, women, seniors]
      - { label: "Placeholder content", name: placeholder, widget: boolean, default: false, hint: "Check this while real copy/branding is still pending" }
      - { label: "Short summary (used on homepage)", name: summary, widget: text }
      - { label: "Full description", name: body, widget: markdown }

  - name: settings
    label: Site Settings
    files:
      - name: site
        label: "Core Church Info"
        file: "site/src/content/settings/site.yaml"
        fields:
          - { label: "Church name", name: churchName, widget: string }
          - { label: Address, name: address, widget: string }
          - { label: "Google Maps link", name: mapsUrl, widget: string }
          - { label: "Contact inbox email", name: email, widget: string }
          - { label: Phone, name: phone, widget: string, required: false, hint: "Shown on the Contact page and in the footer" }
          - { label: "Web analytics token", name: webAnalyticsToken, widget: string, required: false, hint: "From Cloudflare > Analytics & Logs > Web Analytics > your site. Leave blank to collect nothing." }
          - label: "Service times"
            name: serviceTimes
            widget: list
            fields:
              - { label: Label, name: label, widget: string }
              - { label: Day, name: day, widget: select, options: [Sunday, Monday, Tuesday, Wednesday, Thursday, Friday, Saturday] }
              - { label: "Time (24h HH:MM)", name: time, widget: string }
          - label: Socials
            name: socials
            widget: object
            fields:
              - { label: Facebook, name: facebook, widget: string, required: false }
              - { label: Instagram, name: instagram, widget: string, required: false }
              - { label: "YouTube channel URL", name: youtubeUrl, widget: string }
              - { label: "YouTube channel ID (UC…)", name: youtubeChannelId, widget: string, required: false }
          - { label: "Zeffy giving URL", name: zeffyUrl, widget: string }
          - { label: "Other giving options (Linktree)", name: givingLinksUrl, widget: string, required: false, hint: "Shown on the Give page as additional digital giving options" }
          - { label: "Event calendar feed URL (https, not webcal)", name: calendarFeedUrl, widget: string, required: false }

      - name: livestream_override
        label: "Livestream Override"
        file: "site/src/content/livestreamOverride/current.yaml"
        fields:
          - { label: "Override is active", name: active, widget: boolean, default: false, hint: "When on, this always overrides auto-detection — use for this week's live URL" }
          - { label: "This week's live YouTube URL", name: youtubeUrl, widget: string, required: false }
          - { label: "Internal note (staff only, not shown publicly)", name: note, widget: string, required: false }

      - name: banner
        label: "Homepage Banner"
        file: "site/src/content/banner/current.yaml"
        fields:
          - { label: "Banner is active", name: active, widget: boolean, default: false, hint: "Turn on to show this banner on the homepage; turn off when the season/event is over" }
          - { label: Image, name: image, widget: image, required: false, hint: "Upload here — lands in site/public/uploads/ automatically" }
          - { label: Headline, name: headline, widget: string, required: false }
          - { label: "Link URL (optional)", name: linkUrl, widget: string, required: false }
          - { label: "Link button text (optional)", name: linkLabel, widget: string, required: false }
