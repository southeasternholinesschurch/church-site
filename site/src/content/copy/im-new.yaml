# The words on the im-new page.
#
# Edited in the staff app at /website/copy, one file per page. Every key here
# is read by the page; if one goes missing the page shows the sentence written
# into it instead, so a mistake never leaves a heading blank.
#
# Names, times, addresses and links are NOT here — they come from Settings, so
# one edit fixes them everywhere.

hero:
  back: "← About"
  eyebrow: "I'm New"
  headline: "We're so glad you're here."
  lede: "Whether you're exploring faith, looking for a church home, or just visiting the area — there's a place for you at Fairhaven Community Church. We're a friendly, Bible-centered church on the southeast side of Fairhaven, five minutes off I-465 at the Meadowbrook Road exit."
expect:
