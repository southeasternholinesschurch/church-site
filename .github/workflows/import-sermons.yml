name: Import sermons

# Keeps the Sermons page current without anyone running anything.
#
# The site already rebuilds nightly (the rebuild-cron Worker), which slides the
# rolling window and drops services as they age out — but that only ever
# REMOVES. Adding new services needs the import, which is what this does.
#
# Committing the new markdown is what publishes them: the push triggers
# Cloudflare Workers Builds exactly like a hand-made commit.
#
# The one credential is YOUTUBE_API_KEY (repo secret, YouTube Data API v3,
# read-only). It is what makes the job trustworthy rather than merely working:
# the API carries video durations, and durations are how a restarted stream's
# short fragments are told apart from the real recording. --strict refuses to
# run without it — see the guard in the importer for why a keyless nightly run
# would actively corrupt the archive.
#
# Quota is not a concern: ~30 units a night against a 10,000/day allowance.

# NO SCHEDULE HERE, AND THAT IS DELIBERATE.
#
# A fresh copy of this template has no YouTube channel and no YOUTUBE_API_KEY,
# so a daily cron does nothing but fail every morning and mail whoever owns the
# repository. It did exactly that here, every day for weeks, until the only
# person receiving them had learned to ignore the subject line — at which point
# a real failure would have arrived looking identical.
#
# TO TURN IT ON, once the channel is yours:
#   1. Set CHANNEL_ID in site/scripts/import-sermons.mjs
#   2. Add the YOUTUBE_API_KEY secret (Settings -> Secrets and variables ->
#      Actions). docs/transcripts.md covers the Google side.
#   3. Run it by hand from the Actions tab and check what it filed.
#   4. Then add the schedule back:
#        schedule:
#          - cron: '0 9 * * *'   # 09:00 UTC daily
#
# Step 3 before step 4. The first run against a real channel is the one that
# tells you whether your service titles parse, and that is worth watching.
on:
  workflow_dispatch: # run it by hand from the Actions tab

# The job's whole purpose is to commit; nothing else is needed.
permissions:
  contents: write

concurrency:
  group: import-sermons
  cancel-in-progress: false

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Check out the TIP of main, not the SHA that triggered the run.
          # A manual run started from a stale page (or any run queued behind a
          # push) otherwise lands on an old commit, and the push is rejected as
          # non-fast-forward. That is exactly how the first real run failed.
          ref: main
          # Full history: a shallow clone can't rebase onto origin below.
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      # No `npm ci` on purpose: the importer uses only node builtins (fs, path,
      # url, fetch), so the job stays fast and cannot be broken by a dependency.

      - name: Import new services
        working-directory: site
        # --strict is the important flag. Unattended, the dangerous failure is
        # a SILENT one: if the channel's titling changes, nothing parses, and
        # without --strict the job would cheerfully commit nothing while the
        # archive quietly went stale. --strict fails the run instead, so it
        # shows up as a red X rather than as months of missing services.
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        #
        # NO --prune. It removes archive entries whose video has gone from the
        # channel, which sounds tidy and is not: a sermon page can hold hours of
        # reviewed, hand-edited text, and a video that is briefly unlisted or
        # re-uploaded reads exactly like a deleted one. Upstream this flag very
        # nearly took 3,540 reviewed words off a sermon that was simply
        # retitled. Remove entries by hand, in the dashboard, where you can see
        # what you are removing.
        run: node scripts/import-sermons.mjs --write --strict

      - name: Import transcripts
        working-directory: site
        # Runs AFTER the sermon import, and that order is load-bearing.
        #
        # Both jobs draw on ONE 10,000-unit daily quota. Transcripts are the
        # greedy one — 250 units per sermon against the importer's handful — so
        # running them first starves the job that actually matters and the
        # archive stops updating. That is not hypothetical: it failed exactly
        # this way on 2026-09-11, when a manual back-catalogue run had already
        # spent 84% of the day's units.
        #
        # Nothing is lost by running second: both steps finish before the
        # single commit below, so a new sermon still arrives with its
        # transcript in one commit.
        #
        # Quota, not time, is the limit: 10,000 units a day, and each sermon
        # costs 250 (captions.list 50 + captions.download 200). The script caps
        # itself at 35 so the sermon import below still has units to spend, and
        # works through a back-catalogue over several nights.
        #
        # continue-on-error because a transcript is an enhancement: if YouTube
        # refuses, or the token has been revoked, the sermon archive itself
        # must still update.
        continue-on-error: true
        env:
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
        run: |
          if [ -z "$GOOGLE_REFRESH_TOKEN" ]; then
            echo "No Google OAuth secrets set — skipping transcripts."
            echo "See docs/transcripts.md. The sermon import below is unaffected."
            exit 0
          fi
          node scripts/import-transcripts.mjs --write

      - name: Commit any new services and transcripts
        run: |
          # Both paths, or a transcript would be fetched, spent against quota,
          # and then thrown away when the runner is destroyed.
          if [ -z "$(git status --porcelain site/src/content/sermons site/transcripts)" ]; then
            echo "Nothing new — no services and no transcripts to commit."
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/src/content/sermons site/transcripts
          # Name what changed, so the history is readable at a glance.
          added=$(git diff --cached --name-only --diff-filter=A -- site/src/content/sermons | wc -l | tr -d ' ')
          removed=$(git diff --cached --name-only --diff-filter=D -- site/src/content/sermons | wc -l | tr -d ' ')
          texts=$(git diff --cached --name-only -- site/transcripts | wc -l | tr -d ' ')
          git commit -m "Sermons: +${added} new, -${removed} aged out, ${texts} transcript(s)" \
                     -m "Automated by .github/workflows/import-sermons.yml from the channel's RSS feed and, for transcripts, the YouTube Data API."

          # Absorb anything pushed while this job was running. The commit only
          # ever touches site/src/content/sermons and site/transcripts, so a
          # rebase here cannot conflict with work happening elsewhere.
          git pull --rebase origin main
          git push
